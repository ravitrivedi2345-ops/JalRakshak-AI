version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=JalRakshak AI Backend
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/jalrakshak
      - JWT_SECRET_KEY=production_secret_change_me
      - FRONTEND_ORIGINS=http://localhost:5173,http://localhost:8443
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:15-3.3
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jalrakshak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
