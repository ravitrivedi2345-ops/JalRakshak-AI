# Render Cloud Deployment Blueprint for JalRakshak AI
# Web Service (FastAPI Backend) + Managed PostgreSQL Database

services:
  - type: web
    name: jalrakshak-backend
    env: python
    region: singapore # or oregon / frankfurt
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    rootDir: backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jalrakshak-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: "https://jalrakshak.vercel.app,https://jalrakshak-ai.vercel.app"
      - key: SATELLITE_PROVIDER
        value: "sentinel-hub"
      - key: SATELLITE_API_TOKEN
        sync: false
      - key: SENTINEL_HUB_CLIENT_ID
        sync: false
      - key: SENTINEL_HUB_CLIENT_SECRET
        sync: false
      - key: SENTINEL_HUB_INSTANCE_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: jalrakshak-postgres
    databaseName: jalrakshak_db
    user: jalrakshak_user
    region: singapore
    plan: free
